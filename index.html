<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal AI Live Screen Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 20px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .config-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="password"], input[type="text"] {
      background-color: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.stop-btn {
      background-color: #dc2626;
    }
    button.stop-btn:hover {
      background-color: #b91c1c;
    }
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .screen-panel {
      flex: 1.2;
      background-color: #020617;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      background-color: #000;
    }
    .placeholder-text {
      color: #64748b;
      font-size: 0.95rem;
      text-align: center;
    }
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #0f172a;
    }
    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user-msg {
      background-color: #1e3a8a;
      color: #e0f2fe;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .ai-msg {
      background-color: #1e293b;
      color: #f1f5f9;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid #334155;
    }
    .chat-controls {
      padding: 14px;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }
    .chat-controls input {
      flex: 1;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">Personal Screen AI Assistant</div>
    <div class="config-box">
      <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key" />
      <button id="saveKeyBtn">Save Key</button>
      <button id="screenShareBtn">Start Screen Share</button>
    </div>
  </header>

  <div class="main-container">
    <!-- Live Screen Area -->
    <div class="screen-panel">
      <div id="screenPlaceholder" class="placeholder-text">
        Screen share बंद बा। "Start Screen Share" बटन दबाईं।
      </div>
      <video id="screenVideo" autoplay playsinline style="display: none;"></video>
    </div>

    <!-- Chat Area -->
    <div class="chat-panel">
      <div class="messages" id="chatBox">
        <div class="message ai-msg">प्रणाम! हम रउआ पर्सनल स्क्रीन असिस्टेंट हईं। स्क्रीन शेयर करीं आ स्क्रीन से जुड़ल कवनो भी सवाल पूछीं।</div>
      </div>

      <div class="chat-controls">
        <input type="text" id="userInput" placeholder="स्क्रीन के बारे में कुछ पूछीं..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <canvas id="captureCanvas"></canvas>

  <script>
    const screenVideo = document.getElementById("screenVideo");
    const screenPlaceholder = document.getElementById("screenPlaceholder");
    const screenShareBtn = document.getElementById("screenShareBtn");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const canvas = document.getElementById("captureCanvas");

    let screenStream = null;

    // Load saved API Key from LocalStorage
    const savedKey = localStorage.getItem("GEMINI_API_KEY");
    if (savedKey) {
      apiKeyInput.value = savedKey;
    }

    saveKeyBtn.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert("कृपा करके एगो सही Gemini API Key डालीं।");
        return;
      }
      localStorage.setItem("GEMINI_API_KEY", key);
      alert("API Key सुरक्षित सेव हो गइल!");
    });

    // Start or Stop Screen Sharing
    screenShareBtn.addEventListener("click", async () => {
      if (screenStream) {
        stopScreenShare();
        return;
      }

      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always" },
          audio: false
        });

        screenVideo.srcObject = screenStream;
        screenVideo.style.display = "block";
        screenPlaceholder.style.display = "none";
        screenShareBtn.textContent = "Stop Screen Share";
        screenShareBtn.classList.add("stop-btn");

        // Handle user stopping stream via browser bar
        screenStream.getVideoTracks()[0].onended = () => {
          stopScreenShare();
        };
      } catch (err) {
        console.error("Screen share error:", err);
        alert("स्क्रीन शेयर शुरू ना हो पावल: " + err.message);
      }
    });

    function stopScreenShare() {
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
      }
      screenVideo.srcObject = null;
      screenVideo.style.display = "none";
      screenPlaceholder.style.display = "block";
      screenShareBtn.textContent = "Start Screen Share";
      screenShareBtn.classList.remove("stop-btn");
    }

    // Capture screen frame as base64 JPEG
    function captureScreenFrame() {
      if (!screenStream || screenVideo.videoWidth === 0) {
        return null;
      }
      canvas.width = screenVideo.videoWidth;
      canvas.height = screenVideo.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(screenVideo, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
      return dataUrl.split(",")[1];
    }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${sender === "user" ? "user-msg" : "ai-msg"}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    // Send message to Gemini API
    async function handleSend() {
      const text = userInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey) {
        alert("पहिले ऊपर आपन Gemini API Key डाल के Save करीं।");
        return;
      }
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";

      const loadingMsg = appendMessage("ai", "सोच रहल बा...");

      try {
        const base64Image = captureScreenFrame();
        const parts = [{ text: text }];

        if (base64Image) {
          parts.push({
            inlineData: {
              mimeType: "image/jpeg",
              data: base64Image
            }
          });
        }

        const endpoint = `https://generativelanguage.googleapis.com /v1beta/models?key=${apikeygemini-3.6-flash:generateContent?key=${apiKey}`;

        const response = await fetch(endpoint, {
          method: "GET",
        
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || "API अनुरोध में समस्या आइल।");
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "कवनो जवाब ना मिलल।";
        loadingMsg.textContent = gemini-3.6-flash;

      } catch (error) {
        loadingMsg.textContent = "एरर: " + error.message;
      }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });
  </script>
</body>
</html>
