<!DOCTYPE html>
<html lang="bho">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura AI — Personal Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-raised: #1b1d27;
      --bg-raised-2: #22242f;
      --border: rgba(255, 255, 255, 0.09);
      --text: #000000;
      --text-on-dark: #eef0f5;
      --text-muted: #93949f;
      --accent: #f2b84b;
      --accent-dim: rgba(242, 184, 75, 0.16);
      --danger: #e7897a;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: var(--bg-raised);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--accent);
    }
    .status-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--bg-raised-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .status-badge.listening {
      background: rgba(231, 137, 122, 0.2);
      color: var(--danger);
      border-color: rgba(231, 137, 122, 0.4);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="password"], input[type="text"] {
      background: var(--bg-raised-2);
      border: 1px solid var(--border);
      color: var(--text-on-dark);
      padding: 8px 12px;
      border-radius: var(--radius);
      outline: none;
      font-size: 0.9rem;
    }
    input[type="password"]::placeholder, input[type="text"]::placeholder {
      color: var(--text-muted);
    }
    button {
      background: var(--accent);
      color: #111;
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.btn-secondary {
      background: var(--bg-raised-2);
      color: var(--text-on-dark);
      border: 1px solid var(--border);
    }
    button.btn-mic {
      background: var(--bg-raised-2);
      color: var(--text-on-dark);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button.btn-mic.active {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.4;
      font-size: 0.95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent-dim);
      border: 1px solid rgba(242, 184, 75, 0.3);
      color: var(--text);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-on-dark);
    }
    .msg.error {
      background: rgba(231, 137, 122, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    footer {
      padding: 12px 16px;
      background: var(--bg-raised);
      border-top: 1px solid var(--border);
    }
    .chat-form {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }
    .chat-form input {
      flex: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="title">Aura Voice AI</span>
      <span id="voice-status" class="status-badge">माइक: बंद बा</span>
    </div>
    <div class="controls">
      <input type="password" id="api-key" placeholder="Enter Gemini API Key">
      <button id="save-key-btn" class="btn-secondary">Save Key</button>
      <button id="tts-toggle-btn" class="btn-secondary">🔊 आवाज: चालू</button>
    </div>
  </header>

  <main>
    <div id="chat-box">
      <div class="msg assistant">प्रणाम! आपन Gemini API Key डाल के Save Key दबाईं। रउआँ नीचे माइक बटन (🎙️) दबा के बोल सकीलें भा टाइप क के कुछुओ पूछ सकीलें। AI रउआँ के जवाब बोल के भी सुनाई।</div>
    </div>
  </main>

  <footer>
    <form id="chat-form" class="chat-form">
      <button type="button" id="mic-btn" class="btn-mic" title="बोल के पूछीं">🎙️ बोलल शुरू करीं</button>
      <input type="text" id="chat-input" placeholder="कुछ पूछीं भा माइक दबा के बोलीं..." autocomplete="off">
      <button type="submit">भेजीं</button>
    </form>
  </footer>

  <script>
    const apiKeyInput = document.getElementById('api-key');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const ttsToggleBtn = document.getElementById('tts-toggle-btn');
    const micBtn = document.getElementById('mic-btn');
    const voiceStatus = document.getElementById('voice-status');
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    let apiKey = localStorage.getItem('aura_gemini_key') || '';
    let isSpeakingEnabled = true;
    let isBusy = false;
    let isListening = false;
    let recognition = null;

    if (apiKey) {
      apiKeyInput.value = apiKey;
    }

    // FIX 1: preventDefault ke turant baad ek stray quote (') tha jo
    // unterminated string literal error de raha tha aur poora script
    // parse hone se rok raha tha. Ab yeh clean hai.
    saveKeyBtn.addEventListener('click', (event) => {
      event.preventDefault();
      apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        localStorage.setItem('aura_gemini_key', apiKey);
        alert('API Key सेव हो गइल!');
      } else {
        alert('कृपया एगो सही API Key डालीं!');
      }
    });

    // आवाज (TTS) ऑन/ऑफ टॉगल
    ttsToggleBtn.addEventListener('click', () => {
      isSpeakingEnabled = !isSpeakingEnabled;
      if (isSpeakingEnabled) {
        ttsToggleBtn.textContent = '🔊 आवाज: चालू';
      } else {
        ttsToggleBtn.textContent = '🔇 आवाज: बंद';
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      }
    });

    // ब्राउज़र में आवाज सुनल (Speech-to-Text Setup)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN'; // भोजपुरी/हिंदी खातिर सभसे बढ़िया उच्चारण पकड़ेला

      recognition.onstart = () => {
        isListening = true;
        voiceStatus.textContent = '🎙️ सुन रहल बानी... बोलीं';
        voiceStatus.classList.add('listening');
        micBtn.classList.add('active');
        micBtn.textContent = '⏹️ सुनल बंद करीं';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        askGemini(transcript);
      };

      recognition.onerror = (event) => {
        console.error('Speech Recognition Error:', event.error);
        stopListening();
        if (event.error === 'not-allowed') {
          alert('माइक्रोफोन के परमिशन ना मिलल। कृपया ब्राउज़र में माइक अलाउ करीं।');
        }
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      micBtn.disabled = true;
      micBtn.title = 'एह ब्राउज़र में स्पीच रिकग्निशन सपोर्ट नइखे';
      voiceStatus.textContent = 'माइक सपोर्ट नइखे';
    }

    function startListening() {
      if (!recognition || isBusy) return;
      if (window.speechSynthesis) window.speechSynthesis.cancel(); // पहिले से बोलत होखे त रोकि
      try {
        recognition.start();
      } catch (e) {
        console.warn(e);
      }
    }

    function stopListening() {
      isListening = false;
      voiceStatus.textContent = 'माइक: बंद बा';
      voiceStatus.classList.remove('listening');
      micBtn.classList.remove('active');
      micBtn.textContent = '🎙️ बोलल शुरू करीं';
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
    }

    micBtn.addEventListener('click', () => {
      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    });

    function speakText(text) {
      if (!isSpeakingEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      // मार्कडाउन आ गैर-जरूरी सिंबल हटा के साफ बोले खातिर
      const cleanText = text.replace(/[*_#`~>]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'hi-IN';
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    function appendMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    async function askGemini(promptText) {
      if (!apiKey) {
        alert('पहिले आपन Gemini API Key डाल के Save करीं!');
        return;
      }

      isBusy = true;
      appendMessage(promptText, 'user');
      const pendingBubble = appendMessage('सोच रहल बानी...', 'assistant');

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKey}`;

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            system_instruction: {
              parts: [{ text: "रउआँ एगो मददगार वॉइस असिस्टेंट हईं। आसान आ छोट, संक्षेप में जवाब दीं ताकि बोले में बढ़िया लागे।" }]
            }
          })
        });

        const data = await res.json();

        if (data.error) {
          throw new Error(data.error.message || 'API एरर आइल बा');
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'माफ़ करीं, कवनो जवाब ना मिलल।';
        pendingBubble.textContent = reply;

        // AI के आवाज में जवाब सुनाई
        speakText(reply);
      } catch (err) {
        pendingBubble.className = 'msg error';
        pendingBubble.textContent = 'गड़बड़ भइल: ' + err.message;
      } finally {
        isBusy = false;
      }
    }

    // FIX 2: pehle yahan sirf ek tooti hui string 'chatForm.addEventListener');
    // thi — koi actual submit listener attach hi nahi hua tha, isliye
    // "भेजीं" dabane ya Enter dabane par kuch nahi hota tha. Ab यह theek se
    // kaam karta hai.
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (text && !isBusy) {
        askGemini(text);
        chatInput.value = '';
      }
    });
  </script>
</body>
</html>
