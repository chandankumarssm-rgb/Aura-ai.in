<!DOCTYPE html>
<html lang="bho">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini — पर्सनल AI सहायक</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #131314;
      --bg-sidebar: #1e1f20;
      --bg-surface: #282a2c;
      --bg-input: #1e1f20;
      --text-main: #e3e3e3;
      --text-sub: #c4c7c5;
      --text-muted: #8e918f;
      --accent-blue: #a8c7fa;
      --accent-grad: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
      --border-subtle: #333537;
      --radius-pill: 9999px;
      --radius-card: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Google Sans', 'Roboto', sans-serif;
      display: flex;
      overflow: hidden;
    }

    /* Side navigation bar */
    aside {
      width: 280px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 16px;
      border-right: 1px solid var(--border-subtle);
      transition: all 0.3s ease;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      color: var(--text-main);
      border: none;
      padding: 12px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background: #37393b;
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 10px;
    }

    .history-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 8px 12px 4px 12px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      color: var(--text-sub);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: background 0.2s;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    /* Main container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top bar */
    header {
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .model-selector {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #4285f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      color: #fff;
    }

    /* Chat area */
    #chat-scroll-view {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Hero greetings when empty */
    .hero-view {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 500;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .hero-sub {
      font-size: 2.8rem;
      color: #444746;
      font-weight: 500;
      margin-top: -8px;
    }

    /* Message styling */
    .message-row {
      display: flex;
      gap: 16px;
      line-height: 1.6;
      font-size: 1rem;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 85%;
      padding: 12px 18px;
      border-radius: var(--radius-card);
    }

    .message-row.user .message-bubble {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border-radius: 20px 20px 4px 20px;
    }

    .message-row.model {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .gemini-sparkle-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .message-row.model .message-text {
      color: var(--text-main);
      flex: 1;
    }

    /* Input dock */
    .input-area-wrapper {
      padding: 16px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-box {
      width: 100%;
      max-width: 820px;
      background: var(--bg-input);
      border-radius: 28px;
      border: 1px solid var(--border-subtle);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .input-box textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 150px;
    }

    .input-box textarea::placeholder {
      color: var(--text-muted);
    }

    .input-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .disclaimer-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- बायाँ साइडबार -->
  <aside id="sidebar">
    <div class="sidebar-top">
      <button class="icon-btn" title="मेनू">&#9776;</button>
    </div>
    <button class="new-chat-btn">
      <span>＋</span>
      <span>नया चैट शुरू करीं</span>
    </button>
    <div class="chat-history-list">
      <div class="history-title">हाल के गपशप</div>
      <div class="history-item">Aura AI Voice प्रोजेक्ट</div>
      <div class="history-item">वेबसाइट खातिर नया डिजाइन</div>
      <div class="history-item">भोजपुरी ट्रांसलेशन सवाल</div>
    </div>
  </aside>

  <!-- मुख्य बातचीत एरिया -->
  <main>
    <header>
      <div class="model-selector">
        <span>Gemini Advanced</span>
        <span style="font-size: 0.75rem;">▼</span>
      </div>
      <div class="avatar">U</div>
    </header>

    <div id="chat-scroll-view">
      <div class="chat-container" id="chat-thread">
        <!-- वेलकम स्क्रीन -->
        <div class="hero-view" id="hero-view">
          <div class="hero-title">प्रणाम, मित्र</div>
          <div class="hero-sub">आज हम रउआँ के कइसे मदद करीं?</div>
        </div>
      </div>
    </div>

    <!-- इनपुट बार -->
    <div class="input-area-wrapper">
      <div class="input-box">
        <textarea id="prompt-input" rows="1" placeholder="कवनो सवाल पूछीं भा मदद माँगीं..."></textarea>
        <div class="input-toolbar">
          <div class="toolbar-left">
            <button class="icon-btn" title="फोटो भा फाइल जोड़ीं">📎</button>
            <button class="icon-btn" title="माइक">🎙️</button>
          </div>
          <div class="toolbar-right">
            <button id="send-btn" class="icon-btn" title="भेजीं" style="color: var(--accent-blue);">➔</button>
          </div>
        </div>
      </div>
      <div class="disclaimer-text">
        Gemini गलत जानकारी दे सकेला, एहसे जरूरी बातन के जाँच खुद क लीं।
      </div>
    </div>
  </main>

  <script>
    const sendBtn = document.getElementById('send-btn');
    const promptInput = document.getElementById('prompt-input');
    const chatThread = document.getElementById('chat-thread');
    const heroView = document.getElementById('hero-view');

    function sendMessage() {
      const text = promptInput.value.trim();
      if (!text) return;

      // अगर वेलकम मैसेज बा त हटा दीं
      if (heroView) heroView.style.display = 'none';

      // 1. यूजर के मैसेज UI में जोड़ीं
      const userRow = document.createElement('div');
      userRow.className = 'message-row user';
      userRow.innerHTML = `<div class="message-bubble">${text}</div>`;
      chatThread.appendChild(userRow);

      promptInput.value = '';

      // 2. Gemini के जवाब के सिमुलेशन
      const modelRow = document.createElement('div');
      modelRow.className = 'message-row model';
      modelRow.innerHTML = `
        <svg class="gemini-sparkle-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#sparkle-gradient)"/>
          <defs>
            <linearGradient id="sparkle-gradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4285F4"/>
              <stop offset="0.5" stop-color="#9B72CB"/>
              <stop offset="1" stop-color="#D96570"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="message-text">रउआँ के सवाल मिल गइल! हम एगो AI बानी आ रउआँ जइसन कहब, ओइसहीं काम करब।</div>
      `;
      chatThread.appendChild(modelRow);

      window.scrollTo(0, document.body.scrollHeight);
    }

    sendBtn.addEventListener('click', sendMessage);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
