<!DOCTYPE html>
<html lang="bho">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0e1217">
<title>Aura AI Advance - Samsung One UI Edition</title>

<style>
:root {
  --bg: #0e1217;
  --panel: #161b22;
  --panel2: #21262d;
  --panel3: #30363d;
  --border: rgba(255, 255, 255, 0.1);
  --text: #f0f6fc;
  --text-muted: #8b949e;
  --accent: #2f80ed;
  --accent-glow: rgba(47, 128, 237, 0.25);
  --bubble-user: #2f80ed;
  --bubble-ai: #21262d;
  --danger: #f85149;
  --success: #3fb950;
  --radius-card: 24px;
  --radius-bubble: 20px;
  --radius-pill: 50px;
  --font-size: 15px;
  --blur-val: 12px;
}

body.light {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --panel2: #edf0f5;
  --panel3: #e1e4ea;
  --border: rgba(0, 0, 0, 0.08);
  --text: #1b1f24;
  --text-muted: #6e7781;
  --accent: #007aff;
  --accent-glow: rgba(0, 122, 255, 0.15);
  --bubble-user: #007aff;
  --bubble-ai: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-size: var(--font-size); }

.app { display: flex; width: 100%; height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 300px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px;
  z-index: 50;
  transition: transform 0.3s ease;
}

.sidebar-header { padding: 12px 6px 20px; }
.sidebar-header h2 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.sidebar-header span { font-size: 11px; color: var(--accent); background: var(--accent-glow); padding: 3px 8px; border-radius: var(--radius-pill); }

.btn-new-chat {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-pill);
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px var(--accent-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.history { flex: 1; overflow-y: auto; margin: 15px 0; display: flex; flex-direction: column; gap: 6px; }
.history-item {
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--panel2);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-item:hover { background: var(--panel3); }

.sidebar-footer { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
.side-btn {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: none;
  color: var(--text);
  border-radius: 12px;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}
.side-btn:hover { background: var(--panel2); }

/* MAIN VIEW */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

.header {
  height: 60px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--panel2);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.icon-btn:hover { background: var(--panel3); }

/* CHAT BOX */
.chat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px 16px 140px;
  scroll-behavior: smooth;
}
.chat-container { width: min(780px, 100%); margin: auto; }

.welcome {
  text-align: center;
  padding: 50px 10px;
}
.welcome h1 { font-size: 28px; margin-bottom: 8px; font-weight: 800; }
.welcome p { color: var(--text-muted); font-size: 14px; max-width: 460px; margin: 0 auto 20px; }

.message-row { display: flex; gap: 12px; margin-bottom: 20px; }
.message-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--panel2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.message-row.user .msg-avatar { background: var(--accent); color: #fff; }

.msg-bubble {
  max-width: 75%;
  padding: 14px 18px;
  border-radius: var(--radius-bubble);
  line-height: 1.6;
  word-break: break-word;
  white-space: pre-wrap;
}
.message-row.user .msg-bubble {
  background: var(--bubble-user);
  color: #fff;
  border-top-right-radius: 4px;
}
.message-row.assistant .msg-bubble {
  background: var(--bubble-ai);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
}
.msg-image { max-width: 260px; border-radius: 14px; margin-bottom: 8px; display: block; }

.msg-actions { display: flex; gap: 8px; margin-top: 6px; }
.action-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  padding: 2px 6px;
}
.action-btn:hover { color: var(--text); }

/* FLOATING INPUT COMPOSER */
.composer-wrap {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 20px 24px;
  background: linear-gradient(180deg, transparent, var(--bg) 50%);
  pointer-events: none;
}
.composer {
  width: min(780px, 100%);
  margin: auto;
  pointer-events: all;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.composer textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: var(--font-size);
  resize: none;
  max-height: 120px;
  padding: 8px;
}

.composer-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--panel2);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.composer-btn.send { background: var(--accent); color: #fff; }
.composer-btn.mic-active { background: var(--danger); color: #fff; }

/* MODALS */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(var(--blur-val));
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 200;
}
.modal.open { display: flex; }
.modal-content {
  width: min(600px, 100%);
  max-height: 85vh;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }

/* REAL SETTINGS CONTROLS */
.setting-box {
  background: var(--panel2);
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
}
.setting-box label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.setting-box p { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.setting-box input[type="text"], .setting-box select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  outline: none;
}
.setting-box input[type="range"] { width: 100%; accent-color: var(--accent); }

@media(max-width: 768px) {
  .sidebar { position: fixed; left: -300px; top: 0; bottom: 0; }
  .sidebar.open { transform: translateX(300px); }
}
</style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Aura AI <span>One UI</span></h2>
    </div>

    <button class="btn-new-chat" id="newChatBtn">＋ नया चैट</button>

    <div class="history" id="historyBox"></div>

    <div class="sidebar-footer">
      <button class="side-btn" id="themeBtn">🌓 डार्क / लाइट मोड</button>
      <button class="side-btn" id="memoryBtn">🧠 AI Memory</button>
      <button class="side-btn" id="settingsBtn">⚙️ One UI सेटिंग्स</button>
      <button class="side-btn" id="clearBtn">🗑️ चैट साफ करीं</button>
    </div>
  </aside>

  <!-- MAIN CHAT -->
  <main class="main">
    <header class="header">
      <button class="icon-btn" id="menuBtn">☰</button>
      <div>
        <strong id="modelHeader">Gemini 2.5 Flash</strong>
        <div style="font-size:10px;color:var(--success);text-align:center;">● ऑनलाइन</div>
      </div>
      <button class="icon-btn" id="quickSettingsBtn">⚙️</button>
    </header>

    <div class="chat-scroll" id="chatBox">
      <div class="chat-container" id="chatInner">
        <div class="welcome" id="welcomeScreen">
          <h1>प्रणाम! हम Aura AI हईं 👋</h1>
          <p>सच्चा काम करे वाला Samsung One UI इंटरफ़ेस। बिना कवनो फर्जी सेटिंग के।</p>
        </div>
      </div>
    </div>

    <!-- COMPOSER -->
    <div class="composer-wrap">
      <div class="composer">
        <input type="file" id="imageInput" accept="image/*" hidden>
        <button class="composer-btn" id="imageBtn">📷</button>
        <button class="composer-btn" id="micBtn">🎙️</button>
        <textarea id="inputBox" rows="1" placeholder="भोजपुरी भा हिंदी में कुछुओ पूछीं..."></textarea>
        <button class="composer-btn send" id="sendBtn">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- REAL SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>One UI सेटिंग्स & API सेटअप</h3>
      <button class="icon-btn" id="closeSettings">✕</button>
    </div>
    <div class="modal-body">
      
      <!-- API KEY SETTING -->
      <div class="setting-box" style="border:1px solid var(--accent);">
        <label>🔑 Google Gemini API Key</label>
        <p>आपन खुद के Gemini API Key डालीं (aistudio.google.com से मुफ्त मिली):</p>
        <input type="text" id="apiKeyInput" placeholder="AIzaSy...">
        <button class="btn-new-chat" style="margin-top:8px;padding:8px;" id="saveKeyBtn">सेव करीं</button>
      </div>

      <!-- AI MODEL SELECT -->
      <div class="setting-box">
        <label>🤖 मॉडल चुनीं</label>
        <select id="modelSelect">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Super Fast)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (Deep Logic)</option>
        </select>
      </div>

      <!-- ACCENT COLOR -->
      <div class="setting-box">
        <label>🎨 One UI Accent Color</label>
        <select id="accentSelect">
          <option value="#2f80ed">Samsung Classic Blue</option>
          <option value="#8e44ad">Phantom Violet</option>
          <option value="#27ae60">Emerald Green</option>
          <option value="#e67e22">Amber Sunset</option>
          <option value="#eb5757">Crimson Red</option>
        </select>
      </div>

      <!-- FONT SIZE -->
      <div class="setting-box">
        <label>🔤 फॉन्ट साइज (Font Scale)</label>
        <input type="range" id="fontRange" min="13" max="19" value="15">
      </div>

      <!-- BUBBLE ROUNDNESS -->
      <div class="setting-box">
        <label>🔘 बबल गोलाई (Border Radius)</label>
        <input type="range" id="radiusRange" min="8" max="32" value="20">
      </div>

      <!-- BLUR STRENGTH -->
      <div class="setting-box">
        <label>✨ बैकग्राउंड ब्लर (Blur Filter)</label>
        <input type="range" id="blurRange" min="0" max="25" value="12">
      </div>

    </div>
  </div>
</div>

<!-- MEMORY MODAL -->
<div class="modal" id="memoryModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🧠 AI मेमोरी वॉल्ट</h3>
      <button class="icon-btn" id="closeMemory">✕</button>
    </div>
    <div class="modal-body">
      <div id="memoryDisplay" style="white-space:pre-wrap;background:var(--panel2);padding:14px;border-radius:12px;font-size:13px;">कवनो मेमोरी सेव नइखे।</div>
      <button class="btn-new-chat" style="background:var(--danger);" id="clearMemoryBtn">मेमोरी साफ करीं</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   APP STATE & STORAGE
   ========================================================= */
let apiKey = localStorage.getItem("aura_api_key") || "";
let activeModel = localStorage.getItem("aura_model") || "gemini-2.5-flash";
let messages = [];
let pendingImg = null;
let isBusy = false;
let userMemory = JSON.parse(localStorage.getItem("aura_memory") || "[]");

// Apply Saved UI Customizations
document.getElementById("apiKeyInput").value = apiKey;
document.getElementById("modelSelect").value = activeModel;
document.getElementById("modelHeader").textContent = activeModel;

/* =========================================================
   SYSTEM INSTRUCTION & GEMINI API CALL
   ========================================================= */
function getSystemInstruction() {
  const memoryStr = userMemory.length ? userMemory.join("\n") : "None";
  return `
तू Aura AI Advance हउ।
तोहार निर्माता प्रद्युम्न कुमार बानी।
तोहार इंटरफेस Samsung One UI स्टाइल पर आधारित बा।

भाषा नियम:
1. यूजर जब भोजपुरी में बोली, त ठेठ, साफ आ आदरभाव से भोजपुरी में जवाब देब।
2. हिंदी में पूछला पर सरल हिंदी में जवाब देब।
3. अंग्रेजी में पूछला पर English में जवाब देब।

याद रखल मेमोरी:
${memoryStr}
`;
}

async function fetchGemini(userText, imgData) {
  if (!apiKey) {
    throw new Error("कृपया सेटिंग्स (⚙️) में जाके आपन Gemini API Key दर्ज करीं!");
  }

  const contents = messages.map(m => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: [{ text: m.text }]
  }));

  const currentParts = [{ text: userText }];
  if (imgData) {
    currentParts.push({
      inline_data: {
        mime_type: imgData.type,
        data: imgData.base64
      }
    });
  }
  contents.push({ role: "user", parts: currentParts });

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${apiKey}`;

  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: getSystemInstruction() }] },
      contents: contents,
      generationConfig: { maxOutputTokens: 4096, temperature: 0.7 }
    })
  });

  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.[0]?.text || "कवनो उत्तर ना मिलल।";
}

/* =========================================================
   MESSAGE SENDING & UI LOGIC
   ========================================================= */
const chatInner = document.getElementById("chatInner");
const chatBox = document.getElementById("chatBox");
const inputBox = document.getElementById("inputBox");
const sendBtn = document.getElementById("sendBtn");

async function sendMessage() {
  if (isBusy) return;
  const text = inputBox.value.trim();
  if (!text && !pendingImg) return;

  const currentImg = pendingImg;
  pendingImg = null;
  inputBox.value = "";

  document.getElementById("welcomeScreen")?.remove();

  // Render User Message
  appendBubble(text || "फोटो का विवरण", "user", currentImg?.url);
  messages.push({ role: "user", text: text || "फोटो का विवरण" });

  isBusy = true;
  sendBtn.disabled = true;

  // Typing Indicator
  const typingDiv = document.createElement("div");
  typingDiv.className = "message-row assistant";
  typingDiv.innerHTML = `<div class="msg-avatar">✦</div><div class="msg-bubble">Aura सोचत बा...</div>`;
  chatInner.appendChild(typingDiv);
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const reply = await fetchGemini(text, currentImg);
    typingDiv.remove();
    appendBubble(reply, "assistant");
    messages.push({ role: "assistant", text: reply });

    // Auto Memory Check
    if (text.includes("हमार नाम") || text.includes("मेरा नाम")) {
      userMemory.push(text);
      localStorage.setItem("aura_memory", JSON.stringify(userMemory));
    }

    speak(reply);
  } catch (err) {
    typingDiv.remove();
    appendBubble("एरर: " + err.message, "assistant");
  } finally {
    isBusy = false;
    sendBtn.disabled = false;
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

function appendBubble(text, role, imgUrl) {
  const row = document.createElement("div");
  row.className = `message-row ${role}`;
  row.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '👤' : '✦'}</div>
    <div style="max-width:75%">
      <div class="msg-bubble">
        ${imgUrl ? `<img src="${imgUrl}" class="msg-image">` : ''}
        ${text}
      </div>
      ${role === 'assistant' ? `
        <div class="msg-actions">
          <button class="action-btn" onclick="navigator.clipboard.writeText(\`${text.replace(/`/g, "\\`")}\`)">कॉपी</button>
          <button class="action-btn" onclick="speak(\`${text.replace(/`/g, "\\`")}\`)">सुनीं</button>
        </div>
      ` : ''}
    </div>
  `;
  chatInner.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

/* =========================================================
   VOICE (STT / TTS) & IMAGE
   ========================================================= */
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/[*_#`~]/g, "");
  const ut = new SpeechSynthesisUtterance(clean);
  ut.lang = "hi-IN";
  window.speechSynthesis.speak(ut);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const recog = new SpeechRecognition();
  recog.lang = "hi-IN";
  let listening = false;

  document.getElementById("micBtn").onclick = () => {
    if (!listening) {
      recog.start();
      document.getElementById("micBtn").classList.add("mic-active");
      listening = true;
    } else {
      recog.stop();
      document.getElementById("micBtn").classList.remove("mic-active");
      listening = false;
    }
  };

  recog.onresult = (e) => {
    inputBox.value = e.results[0][0].transcript;
    document.getElementById("micBtn").classList.remove("mic-active");
    listening = false;
    sendMessage();
  };
  recog.onerror = () => {
    document.getElementById("micBtn").classList.remove("mic-active");
    listening = false;
  };
}

document.getElementById("imageBtn").onclick = () => document.getElementById("imageInput").click();
document.getElementById("imageInput").onchange = (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingImg = {
      type: file.type,
      base64: reader.result.split(",")[1],
      url: reader.result
    };
    alert("फोटो लोड हो गइल! अब आपन सवाल लिख के भेज दीं।");
  };
  reader.readAsDataURL(file);
};

/* =========================================================
   WORKING SETTINGS EVENT LISTENERS
   ========================================================= */
document.getElementById("saveKeyBtn").onclick = () => {
  apiKey = document.getElementById("apiKeyInput").value.trim();
  localStorage.setItem("aura_api_key", apiKey);
  alert("API Key सुरक्षित सेव हो गइल बा!");
};

document.getElementById("modelSelect").onchange = (e) => {
  activeModel = e.target.value;
  localStorage.setItem("aura_model", activeModel);
  document.getElementById("modelHeader").textContent = activeModel;
};

document.getElementById("accentSelect").onchange = (e) => {
  document.documentElement.style.setProperty("--accent", e.target.value);
  document.documentElement.style.setProperty("--bubble-user", e.target.value);
};

document.getElementById("fontRange").oninput = (e) => {
  document.documentElement.style.setProperty("--font-size", e.target.value + "px");
};

document.getElementById("radiusRange").oninput = (e) => {
  document.documentElement.style.setProperty("--radius-bubble", e.target.value + "px");
};

document.getElementById("blurRange").oninput = (e) => {
  document.documentElement.style.setProperty("--blur-val", e.target.value + "px");
};

/* =========================================================
   NAVIGATION & MODALS
   ========================================================= */
sendBtn.onclick = sendMessage;
inputBox.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

document.getElementById("menuBtn").onclick = () => document.getElementById("sidebar").classList.toggle("open");
document.getElementById("settingsBtn").onclick = () => document.getElementById("settingsModal").classList.add("open");
document.getElementById("quickSettingsBtn").onclick = () => document.getElementById("settingsModal").classList.add("open");
document.getElementById("closeSettings").onclick = () => document.getElementById("settingsModal").classList.remove("open");

document.getElementById("memoryBtn").onclick = () => {
  document.getElementById("memoryDisplay").textContent = userMemory.join("\n") || "कवनो मेमोरी सेव नइखे।";
  document.getElementById("memoryModal").classList.add("open");
};
document.getElementById("closeMemory").onclick = () => document.getElementById("memoryModal").classList.remove("open");
document.getElementById("clearMemoryBtn").onclick = () => {
  userMemory = [];
  localStorage.removeItem("aura_memory");
  document.getElementById("memoryDisplay").textContent = "कवनो मेमोरी सेव नइखे।";
};

document.getElementById("themeBtn").onclick = () => document.body.classList.toggle("light");
document.getElementById("clearBtn").onclick = () => {
  chatInner.innerHTML = "";
  messages = [];
};
document.getElementById("newChatBtn").onclick = () => {
  chatInner.innerHTML = "";
  messages = [];
  document.getElementById("sidebar").classList.remove("open");
};
</script>
</body>
</html>
