<!DOCTYPE html>
<html lang="bho">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura AI Advance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #131314;
      --bg-header: #1e1f20;
      --bg-surface: #282a2c;
      --bg-input: #1e1f20;
      --text-main: #e3e3e3;
      --text-sub: #c4c7c5;
      --text-muted: #8e918f;
      --accent-blue: #a8c7fa;
      --accent-grad: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
      --border-subtle: #333537;
      --radius-pill: 9999px;
      --radius-card: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Google Sans', 'Roboto', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* टॉप हेडर */
    header {
      height: 64px;
      padding: 10px 20px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 12px;
      z-index: 10;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .key-input {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      outline: none;
      width: 170px;
    }

    .btn-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-pill:hover {
      background: #37393b;
    }

    /* मुख्य चैट स्क्रोलिंग कंटेनर */
    #chat-scroll-view {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: auto 0 0 0;
    }

    /* हीरो ग्रीटिंग */
    .hero-view {
      margin: 40px auto;
      text-align: left;
      width: 100%;
      max-width: 820px;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 500;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 2.6rem;
      color: #55585a;
      font-weight: 500;
      margin-top: -6px;
    }

    /* मैसेज रो */
    .message-row {
      display: flex;
      gap: 14px;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 80%;
      background-color: var(--bg-surface);
      color: var(--text-main);
      padding: 12px 18px;
      border-radius: 20px 20px 4px 20px;
      line-height: 1.5;
      font-size: 0.98rem;
      word-break: break-word;
    }

    .message-bubble img.attached-preview {
      max-width: 100%;
      max-height: 240px;
      border-radius: 12px;
      display: block;
      margin-bottom: 8px;
      object-fit: cover;
    }

    .message-row.model {
      align-items: flex-start;
    }

    .aura-sparkle-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .message-row.model .message-text {
      color: var(--text-main);
      flex: 1;
      line-height: 1.7;
      font-size: 1rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* बॉटम इनपुट बार */
    footer {
      flex-shrink: 0;
      padding: 10px 16px 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-main);
    }

    #image-strip {
      width: 100%;
      max-width: 820px;
      margin-bottom: 8px;
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    #image-strip.active {
      display: flex;
    }

    #image-strip img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 8px;
    }

    #image-strip span {
      font-size: 0.85rem;
      color: var(--text-sub);
      flex: 1;
    }

    #image-strip button {
      background: none;
      border: none;
      color: #e7897a;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .input-dock {
      width: 100%;
      max-width: 820px;
      background: var(--bg-input);
      border-radius: 28px;
      border: 1px solid var(--border-subtle);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .input-dock textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      resize: none;
      outline: none;
      min-height: 38px;
      max-height: 140px;
      line-height: 1.5;
    }

    .input-dock textarea::placeholder {
      color: var(--text-muted);
    }

    .dock-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .round-icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .round-icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .round-icon-btn.listening {
      background: rgba(231, 137, 122, 0.2);
      color: #e7897a;
    }

    .disclaimer {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .hero-title { font-size: 2.2rem; }
      .hero-sub { font-size: 2rem; }
      .key-input { width: 130px; }
    }
  </style>
</head>
<body>

  <!-- हेडर -->
  <header>
    <div class="brand-title">
      <span>Aura AI Advance</span>
    </div>
    <div class="header-actions">
      <input type="password" id="api-key-input" class="key-input" placeholder="Gemini API Key...">
      <button id="save-key-btn" class="btn-pill">Save Key</button>
      <button id="voice-toggle-btn" class="btn-pill">🔊 आवाज: चालू</button>
    </div>
  </header>

  <!-- स्मूथ स्क्रोल आ स्लाइड होखे वाला चैट एरिया -->
  <div id="chat-scroll-view">
    <div class="hero-view" id="hero-view">
      <div class="hero-title">प्रणाम!</div>
      <div class="hero-sub">आज हम रउआँ के कइसे मदद करीं?</div>
    </div>
    <div class="chat-container" id="chat-thread"></div>
  </div>

  <!-- बॉटम इनपुट एरिया (कैमरा, माइक, टेक्स्ट) -->
  <footer>
    <div id="image-strip">
      <img id="image-preview" src="" alt="फोटो">
      <span>फोटो जुड़ गइल बा</span>
      <button id="remove-image-btn" type="button">✕ हटाईं</button>
    </div>

    <div class="input-dock">
      <textarea id="prompt-input" rows="1" placeholder="Aura AI से कुछ पूछीं भा फोटो भेजीं..."></textarea>
      <div class="dock-controls">
        <div class="controls-left">
          <input type="file" id="camera-input" accept="image/*" style="display:none">
          <button id="camera-btn" class="round-icon-btn" title="कैमरा भा गैलरी से फोटो चुनीं">📷</button>
          <button id="mic-btn" class="round-icon-btn" title="बोल के पूछीं">🎙️</button>
        </div>
        <div class="controls-right">
          <button id="send-btn" class="round-icon-btn" title="भेजीं" style="color: var(--accent-blue);">➔</button>
        </div>
      </div>
    </div>
    <div class="disclaimer">
      Aura AI Advance गलत जानकारी दे सकेला, महत्वपूर्ण जानकारी के पुष्टि खुद क लीं।
    </div>
  </footer>

  <script>
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const voiceToggleBtn = document.getElementById('voice-toggle-btn');
    const chatScrollView = document.getElementById('chat-scroll-view');
    const chatThread = document.getElementById('chat-thread');
    const heroView = document.getElementById('hero-view');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const cameraBtn = document.getElementById('camera-btn');
    const cameraInput = document.getElementById('camera-input');
    const imageStrip = document.getElementById('image-strip');
    const imagePreview = document.getElementById('image-preview');
    const removeImageBtn = document.getElementById('remove-image-btn');

    let apiKey = localStorage.getItem('aura_gemini_key') || '';
    let isVoiceActive = true;
    let pendingImage = null; // { mimeType, base64, dataUrl }

    if (apiKey) apiKeyInput.value = apiKey;

    // API Key सेव करे के व्यवस्था
    saveKeyBtn.addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        localStorage.setItem('aura_gemini_key', apiKey);
        alert('API Key सेव हो गइल!');
      } else {
        alert('कृपया एगो सही API Key डालीं');
      }
    });

    // आवाज टॉगल
    voiceToggleBtn.addEventListener('click', () => {
      isVoiceActive = !isVoiceActive;
      voiceToggleBtn.textContent = isVoiceActive ? '🔊 आवाज: चालू' : '🔇 आवाज: बंद';
      if (!isVoiceActive && window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    });

    // कैमरा आ गैलरी से फोटो इनपुट
    cameraBtn.addEventListener('click', () => cameraInput.click());

    cameraInput.addEventListener('change', () => {
      const file = cameraInput.files && cameraInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const base64 = dataUrl.split(',')[1];
        pendingImage = { mimeType: file.type || 'image/jpeg', base64, dataUrl };
        imagePreview.src = dataUrl;
        imageStrip.classList.add('active');
      };
      reader.readAsDataURL(file);
      cameraInput.value = '';
    });

    removeImageBtn.addEventListener('click', () => {
      pendingImage = null;
      imagePreview.src = '';
      imageStrip.classList.remove('active');
    });

    // स्मूथ स्क्रोल फंक्शन (नीचे स्लाइड करे खातिर)
    function scrollToBottom() {
      setTimeout(() => {
        chatScrollView.scrollTo({
          top: chatScrollView.scrollHeight,
          behavior: 'smooth'
        });
      }, 50);
    }

    // आवाज के मधुर आ शांत बनावे वाला फंक्शन
    function speakText(text) {
      if (!isVoiceActive || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const cleanText = text.replace(/[*_#`~>]/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);

      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => 
        (v.lang.includes('hi') || v.lang.includes('IN')) && 
        (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Swara') || v.name.includes('Kavya'))
      ) || voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));

      if (naturalVoice) utterance.voice = naturalVoice;

      utterance.lang = 'hi-IN';
      utterance.rate = 0.95;  // धीमा आ शांत
      utterance.pitch = 1.05; // मधुर टोन

      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function appendUserMessage(text, imageDataUrl) {
      if (heroView) heroView.style.display = 'none';

      const userRow = document.createElement('div');
      userRow.className = 'message-row user';
      
      let contentHtml = '';
      if (imageDataUrl) {
        contentHtml += `<img src="${imageDataUrl}" class="attached-preview" alt="अटैच कइल फोटो">`;
      }
      if (text) {
        contentHtml += `<div>${text}</div>`;
      }

      userRow.innerHTML = `<div class="message-bubble">${contentHtml}</div>`;
      chatThread.appendChild(userRow);
      scrollToBottom();
    }

    function appendModelSkeleton() {
      const modelRow = document.createElement('div');
      modelRow.className = 'message-row model';
      modelRow.innerHTML = `
        <svg class="aura-sparkle-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#sparkle-gradient)"/>
          <defs>
            <linearGradient id="sparkle-gradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4285F4"/>
              <stop offset="0.5" stop-color="#9B72CB"/>
              <stop offset="1" stop-color="#D96570"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="message-text">सोच रहल बानी...</div>
      `;
      chatThread.appendChild(modelRow);
      scrollToBottom();
      return modelRow.querySelector('.message-text');
    }

    async function askAura(queryText, imgData) {
      appendUserMessage(queryText, imgData ? imgData.dataUrl : null);
      const textPlaceholder = appendModelSkeleton();

      if (!apiKey) {
        textPlaceholder.textContent = 'कृपया ऊपर आपन Gemini API Key डाल के "Save Key" दबाईं।';
        return;
      }

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      // सिस्टम इंस्ट्रक्शन: निर्माता 'प्रद्युम्न कुमार'
      const systemInstruction = "रउआँ 'Aura AI Advance' हईं। रउआँ के निर्माण 'प्रद्युम्न कुमार' कइले बानी। जब भी केहू पूछे कि रउआँ के के बनवले बा भा रउआँ के निर्माता के हवें, त गर्व से आ साफ-साफ बताईं कि 'हमार निर्माण प्रद्युम्न कुमार कइले बानी'। बातचीत हमेशा मददगार, मधुर, सरल आ भोजपुरी में करीं।";

      const parts = [];
      if (queryText) parts.push({ text: queryText });
      if (imgData) {
        parts.push({
          inline_data: {
            mime_type: imgData.mimeType,
            data: imgData.base64
          }
        });
      }

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts }],
            system_instruction: { parts: [{ text: systemInstruction }] }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'API एरर आइल');

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'कवनो जवाब ना मिलल।';
        textPlaceholder.textContent = reply;
        scrollToBottom();

        // मधुर आवाज में उत्तर
        speakText(reply);
      } catch (err) {
        textPlaceholder.textContent = 'समस्या आ गइल: ' + err.message;
        scrollToBottom();
      }
    }

    function handleSend() {
      const text = promptInput.value.trim();
      if (!text && !pendingImage) return;

      const imgToSend = pendingImage;
      const queryToSend = text || (imgToSend ? 'एह फोटो में का बा, बताईं।' : '');

      promptInput.value = '';
      pendingImage = null;
      imageStrip.classList.remove('active');

      askAura(queryToSend, imgToSend);
    }

    sendBtn.addEventListener('click', handleSend);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // माइक (Speech to text)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.onstart = () => micBtn.classList.add('listening');
      recognition.onend = () => micBtn.classList.remove('listening');
      recognition.onresult = (e) => {
        promptInput.value = e.results[0][0].transcript;
        handleSend();
      };
      micBtn.addEventListener('click', () => recognition.start());
    } else {
      micBtn.style.display = 'none';
    }
  </script>
</body>
</html>
