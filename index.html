<!DOCTYPE html>
<html lang="bho">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">

<title>Aura AI Advance</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b0d12;
  --panel:#11141b;
  --panel2:#181c25;
  --border:rgba(255,255,255,.09);
  --text:#f4f6fb;
  --muted:#9298a7;
  --accent:#f2b84b;
  --accent2:#ffd477;
  --danger:#ef8175;
  --user:#332a18;
  --shadow:0 20px 60px rgba(0,0,0,.25);
}

body.light{
  --bg:#f6f7f9;
  --panel:#ffffff;
  --panel2:#eef0f4;
  --border:rgba(0,0,0,.09);
  --text:#15171c;
  --muted:#6e7480;
  --user:#fff1cf;
  --shadow:0 20px 50px rgba(0,0,0,.08);
}

html,body{
  height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}

/* APP */

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:14px;
  transition:.25s;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 6px 18px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#16120b;
  font-size:20px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(242,184,75,.22);
}

.brand-text strong{
  display:block;
  font-size:16px;
}

.brand-text span{
  font-size:11px;
  color:var(--muted);
}

.new-chat{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--panel2);
  color:var(--text);
  cursor:pointer;
  font-weight:700;
  margin-bottom:15px;
}

.new-chat:hover{
  border-color:var(--accent);
}

.history-title{
  font-size:11px;
  color:var(--muted);
  padding:8px 6px;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  padding:10px 11px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--muted);
  margin-bottom:3px;
}

.history-item:hover,
.history-item.active{
  background:var(--panel2);
  color:var(--text);
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:12px;
}

.side-btn{
  width:100%;
  padding:10px;
  background:transparent;
  border:0;
  color:var(--muted);
  text-align:left;
  border-radius:10px;
  cursor:pointer;
}

.side-btn:hover{
  background:var(--panel2);
  color:var(--text);
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:64px;
  border-bottom:1px solid var(--border);
  background:rgba(17,20,27,.82);
  backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  z-index:5;
}

body.light .header{
  background:rgba(255,255,255,.82);
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu{
  display:none;
  background:transparent;
  color:var(--text);
  border:0;
  font-size:22px;
  cursor:pointer;
}

.ai-name{
  font-weight:800;
}

.online{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:#67d58b;
}

.dot{
  width:7px;
  height:7px;
  background:#67d58b;
  border-radius:50%;
  box-shadow:0 0 12px #67d58b;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--panel2);
  color:var(--text);
  cursor:pointer;
}

.icon-btn:hover{
  border-color:var(--accent);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:28px 16px 130px;
}

.chat-inner{
  width:min(850px,100%);
  margin:auto;
}

/* WELCOME */

.welcome{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.welcome-logo{
  width:72px;
  height:72px;
  border-radius:23px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#17120a;
  font-size:34px;
  font-weight:900;
  box-shadow:0 15px 50px rgba(242,184,75,.2);
  margin-bottom:20px;
}

.welcome h1{
  font-size:clamp(25px,5vw,42px);
  margin-bottom:10px;
}

.welcome p{
  color:var(--muted);
  max-width:560px;
  line-height:1.6;
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:22px;
}

.suggestion{
  padding:9px 12px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:12px;
  cursor:pointer;
}

.suggestion:hover{
  border-color:var(--accent);
}

/* MESSAGES */

.message{
  display:flex;
  gap:12px;
  margin:20px 0;
  animation:appear .25s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.avatar{
  flex:0 0 34px;
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:15px;
}

.message.user .avatar{
  background:var(--accent);
  color:#111;
}

.message-body{
  min-width:0;
  flex:1;
}

.message-name{
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

.message-text{
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.message-image{
  max-width:280px;
  max-height:300px;
  border-radius:14px;
  margin-bottom:8px;
  display:block;
}

.message-actions{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.message-actions button{
  border:0;
  background:var(--panel2);
  color:var(--muted);
  border-radius:8px;
  padding:5px 8px;
  cursor:pointer;
  font-size:11px;
}

.message-actions button:hover{
  color:var(--text);
}

/* TYPING */

.typing{
  display:flex;
  gap:4px;
  padding:8px 0;
}

.typing span{
  width:7px;
  height:7px;
  background:var(--muted);
  border-radius:50%;
  animation:bounce 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-5px);opacity:1}
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:14px 16px 18px;
  background:linear-gradient(transparent,var(--bg) 30%);
  z-index:6;
}

.composer{
  width:min(850px,100%);
  margin:auto;
}

.preview{
  display:none;
  align-items:center;
  gap:10px;
  padding:8px;
  margin-bottom:8px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
}

.preview.visible{
  display:flex;
}

.preview img{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:9px;
}

.preview-text{
  flex:1;
  font-size:12px;
  color:var(--muted);
}

.remove-image{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}

.input-box{
  display:flex;
  align-items:flex-end;
  gap:7px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:8px;
  box-shadow:var(--shadow);
}

.input-box:focus-within{
  border-color:rgba(242,184,75,.6);
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  min-height:42px;
  max-height:130px;
  padding:11px 5px;
  font:inherit;
}

textarea::placeholder{
  color:var(--muted);
}

.send-btn{
  width:43px;
  height:43px;
  border:0;
  border-radius:13px;
  background:var(--accent);
  color:#111;
  cursor:pointer;
  font-size:17px;
  font-weight:800;
}

.tool-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:11px;
  background:var(--panel2);
  color:var(--text);
  cursor:pointer;
}

.tool-btn.active{
  background:var(--danger);
  color:white;
}

.disclaimer{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  margin-top:7px;
}

/* SETTINGS */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(5px);
  display:none;
  place-items:center;
  z-index:100;
  padding:15px;
}

.modal.show{
  display:grid;
}

.modal-card{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-head h2{
  font-size:19px;
}

.close{
  border:0;
  background:var(--panel2);
  color:var(--text);
  width:35px;
  height:35px;
  border-radius:10px;
  cursor:pointer;
}

.setting{
  margin-bottom:17px;
}

.setting label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
}

.setting input,
.setting select{
  width:100%;
  padding:11px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  outline:none;
}

.save-settings{
  width:100%;
  padding:12px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#111;
  font-weight:800;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:750px){

  .sidebar{
    position:fixed;
    left:-285px;
    top:0;
    bottom:0;
    box-shadow:20px 0 50px rgba(0,0,0,.3);
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .composer-wrap{
    left:0;
  }

  .header{
    height:58px;
    padding:0 10px;
  }

  .chat{
    padding:18px 12px 125px;
  }

  .message{
    margin:16px 0;
  }

  .message-image{
    max-width:220px;
  }

  .welcome{
    min-height:60vh;
  }

  .welcome-logo{
    width:60px;
    height:60px;
    font-size:28px;
  }

  .header-actions .icon-btn:nth-child(2){
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">✦</div>
      <div class="brand-text">
        <strong>Aura AI</strong>
        <span>Advance Assistant</span>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">＋ नया चैट</button>

    <div class="history-title">चैट हिस्ट्री</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <button class="side-btn" id="themeBtn">🌙 थीम बदलें</button>
      <button class="side-btn" id="settingsBtn">⚙️ सेटिंग्स</button>
      <button class="side-btn" id="clearBtn">🗑️ चैट साफ करीं</button>
    </div>

  </aside>

  <!-- MAIN -->
  <section class="main">

    <header class="header">

      <div class="header-left">
        <button class="menu" id="menuBtn">☰</button>

        <div>
          <div class="ai-name">Aura AI Advance</div>
          <div class="online">
            <span class="dot"></span>
            ऑनलाइन
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="voiceToggle" title="आवाज">🔊</button>
        <button class="icon-btn" id="newHeaderBtn" title="नया चैट">＋</button>
        <button class="icon-btn" id="settingsHeaderBtn" title="सेटिंग्स">⚙️</button>
      </div>

    </header>

    <main class="chat" id="chatBox">
      <div class="chat-inner" id="chatInner">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">✦</div>

          <h1>प्रणाम! हम Aura AI हईं 👋</h1>

          <p>
            रउआँ सवाल पूछीं, फोटो भेजीं, माइक से बोलीं—
            हम आसान भोजपुरी में मदद करे के कोशिश करब।
          </p>

          <div class="suggestions">
            <button class="suggestion">🌍 मौसम के बारे में बताईं</button>
            <button class="suggestion">💡 एगो नया आइडिया दीं</button>
            <button class="suggestion">📚 पढ़ाई में मदद करीं</button>
            <button class="suggestion">🧠 कुछ नया सिखाईं</button>
          </div>

        </div>

      </div>
    </main>

  </section>

</div>

<!-- COMPOSER -->

<div class="composer-wrap">

  <div class="composer">

    <div class="preview" id="preview">

      <img id="previewImg" src="" alt="फोटो">

      <div class="preview-text">
        📷 फोटो भेजे खातिर तैयार बा
      </div>

      <button class="remove-image" id="removeImage">✕</button>

    </div>

    <form class="input-box" id="chatForm">

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
      >

      <button
        type="button"
        class="tool-btn"
        id="imageBtn"
        title="फोटो जोड़ीं"
      >📷</button>

      <button
        type="button"
        class="tool-btn"
        id="micBtn"
        title="बोलीं"
      >🎙️</button>

      <textarea
        id="chatInput"
        rows="1"
        placeholder="Aura AI से कुछ पूछीं..."
      ></textarea>

      <button
        type="submit"
        class="send-btn"
        title="भेजीं"
      >➤</button>

    </form>

    <div class="disclaimer">
      Aura AI Advance • Gemini powered • जवाब के हमेशा जाँच लीं
    </div>

  </div>

</div>

<!-- SETTINGS MODAL -->

<div class="modal" id="settingsModal">

  <div class="modal-card">

    <div class="modal-head">
      <h2>⚙️ Aura AI Settings</h2>
      <button class="close" id="closeSettings">✕</button>
    </div>

    <div class="setting">
      <label>Gemini API Key</label>
      <input
        type="password"
        id="apiKey"
        placeholder="अपन Gemini API Key डालें"
      >
    </div>

    <div class="setting">
      <label>AI Model</label>

      <select id="modelSelect">
        <option value="gemini-3.1-flash-lite">
          Gemini 3.1 Flash Lite
        </option>

        <option value="gemini-2.5-flash">
          Gemini 2.5 Flash
        </option>
      </select>
    </div>

    <div class="setting">
      <label>भाषा</label>

      <select id="languageSelect">
        <option value="bho">भोजपुरी</option>
        <option value="hi">हिंदी</option>
        <option value="en">English</option>
      </select>
    </div>

    <button class="save-settings" id="saveSettings">
      💾 सेटिंग सेव करीं
    </button>

  </div>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const chatBox = document.getElementById("chatBox");
const chatInner = document.getElementById("chatInner");
const chatInput = document.getElementById("chatInput");
const chatForm = document.getElementById("chatForm");

const sidebar = document.getElementById("sidebar");
const historyBox = document.getElementById("history");

const imageInput = document.getElementById("imageInput");
const imageBtn = document.getElementById("imageBtn");

const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const removeImage = document.getElementById("removeImage");

const micBtn = document.getElementById("micBtn");

const settingsModal = document.getElementById("settingsModal");
const apiKeyInput = document.getElementById("apiKey");
const modelSelect = document.getElementById("modelSelect");
const languageSelect = document.getElementById("languageSelect");

/* =========================
   STATE
========================= */

let apiKey = localStorage.getItem("aura_api_key") || "";
let selectedModel =
  localStorage.getItem("aura_model") ||
  "gemini-3.1-flash-lite";

let language =
  localStorage.getItem("aura_language") || "bho";

let voiceEnabled =
  localStorage.getItem("aura_voice") !== "false";

let pendingImage = null;
let busy = false;

let messages = [];

/* =========================
   INIT
========================= */

apiKeyInput.value = apiKey;
modelSelect.value = selectedModel;
languageSelect.value = language;

if(localStorage.getItem("aura_theme") === "light"){
  document.body.classList.add("light");
}

loadHistory();

/* =========================
   SETTINGS
========================= */

document.getElementById("settingsBtn").onclick = openSettings;
document.getElementById("settingsHeaderBtn").onclick = openSettings;

document.getElementById("closeSettings").onclick = () => {
  settingsModal.classList.remove("show");
};

settingsModal.addEventListener("click",e=>{
  if(e.target === settingsModal){
    settingsModal.classList.remove("show");
  }
});

function openSettings(){
  apiKeyInput.value = apiKey;
  modelSelect.value = selectedModel;
  languageSelect.value = language;
  settingsModal.classList.add("show");
}

document.getElementById("saveSettings").onclick = () => {

  apiKey = apiKeyInput.value.trim();
  selectedModel = modelSelect.value;
  language = languageSelect.value;

  localStorage.setItem("aura_api_key",apiKey);
  localStorage.setItem("aura_model",selectedModel);
  localStorage.setItem("aura_language",language);

  settingsModal.classList.remove("show");

  alert("सेटिंग सेव हो गइल! ✅");
};

/* =========================
   THEME
========================= */

document.getElementById("themeBtn").onclick = toggleTheme;

function toggleTheme(){

  document.body.classList.toggle("light");

  localStorage.setItem(
    "aura_theme",
    document.body.classList.contains("light")
      ? "light"
      : "dark"
  );
}

/* =========================
   VOICE TOGGLE
========================= */

document.getElementById("voiceToggle").onclick = () => {

  voiceEnabled = !voiceEnabled;

  localStorage.setItem(
    "aura_voice",
    voiceEnabled
  );

  document.getElementById("voiceToggle").textContent =
    voiceEnabled ? "🔊" : "🔇";

  if(!voiceEnabled && speechSynthesis){
    speechSynthesis.cancel();
  }
};

/* =========================
   MOBILE MENU
========================= */

document.getElementById("menuBtn").onclick = () => {
  sidebar.classList.toggle("open");
};

/* =========================
   NEW CHAT
========================= */

document.getElementById("newChatBtn").onclick = newChat;
document.getElementById("newHeaderBtn").onclick = newChat;

function newChat(){

  messages = [];
  pendingImage = null;

  chatInner.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="welcome-logo">✦</div>

      <h1>नया चैट शुरू करीं 👋</h1>

      <p>
        रउआँ कुछ पूछीं, फोटो भेजीं भा माइक से बोलीं।
      </p>

      <div class="suggestions">

        <button class="suggestion">
          💡 एगो नया आइडिया दीं
        </button>

        <button class="suggestion">
          📚 पढ़ाई में मदद करीं
        </button>

        <button class="suggestion">
          🧠 कुछ नया सिखाईं
        </button>

      </div>

    </div>
  `;

  attachSuggestions();

  sidebar.classList.remove("open");

  chatInput.focus();
}

/* =========================
   CLEAR CHAT
========================= */

document.getElementById("clearBtn").onclick = () => {

  if(!confirm("सगरी चैट साफ करे के बा?")) return;

  messages = [];

  localStorage.removeItem("aura_current_chat");

  newChat();
};

/* =========================
   SUGGESTIONS
========================= */

function attachSuggestions(){

  document.querySelectorAll(".suggestion").forEach(btn=>{
    btn.onclick = () => {
      chatInput.value = btn.textContent.replace(/^[^\w]+/,"").trim();
      sendMessage();
    };
  });
}

attachSuggestions();

/* =========================
   IMAGE
========================= */

imageBtn.onclick = () => imageInput.click();

imageInput.onchange = () => {

  const file = imageInput.files?.[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("कृपया image file चुनीं।");
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {

    const dataUrl = reader.result;

    pendingImage = {
      mimeType:file.type,
      base64:dataUrl.split(",")[1],
      dataUrl
    };

    previewImg.src = dataUrl;
    preview.classList.add("visible");
  };

  reader.readAsDataURL(file);

  imageInput.value = "";
};

removeImage.onclick = clearImage;

function clearImage(){

  pendingImage = null;
  previewImg.src = "";
  preview.classList.remove("visible");
}

/* =========================
   TEXTAREA
========================= */

chatInput.addEventListener("input",()=>{

  chatInput.style.height = "auto";

  chatInput.style.height =
    Math.min(chatInput.scrollHeight,130) + "px";
});

chatInput.addEventListener("keydown",e=>{

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();
    sendMessage();
  }
});

/* =========================
   FORM
========================= */

chatForm.addEventListener("submit",e=>{
  e.preventDefault();
  sendMessage();
});

/* =========================
   SEND
========================= */

async function sendMessage(){

  if(busy) return;

  const text = chatInput.value.trim();

  if(!text && !pendingImage) return;

  if(!apiKey){

    openSettings();

    alert("पहिले Gemini API Key डाल के सेव करीं।");

    return;
  }

  const image = pendingImage;

  chatInput.value = "";
  chatInput.style.height = "auto";

  clearImage();

  const welcome = document.getElementById("welcome");

  if(welcome) welcome.remove();

  addMessage(
    text || "एह फोटो के बारे में बताईं।",
    "user",
    image?.dataUrl
  );

  messages.push({
    role:"user",
    text:text || "एह फोटो के बारे में बताईं।"
  });

  saveCurrentChat();

  await askGemini(
    text || "एह फोटो में का बा, विस्तार से बताईं।",
    image
  );
}

/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type,imageUrl=null){

  const wrapper = document.createElement("div");
  wrapper.className = "message " + type;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent =
    type === "user" ? "👤" : "✦";

  const body = document.createElement("div");
  body.className = "message-body";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent =
    type === "user" ? "रउआँ" : "Aura AI";

  body.appendChild(name);

  if(imageUrl){

    const img = document.createElement("img");

    img.className = "message-image";
    img.src = imageUrl;

    body.appendChild(img);
  }

  const textNode = document.createElement("div");

  textNode.className = "message-text";
  textNode.textContent = text;

  body.appendChild(textNode);

  if(type === "assistant"){

    const actions = document.createElement("div");

    actions.className = "message-actions";

    const copy = document.createElement("button");

    copy.textContent = "📋 Copy";

    copy.onclick = () => {

      navigator.clipboard.writeText(text);

      copy.textContent = "✅ Copied";

      setTimeout(()=>{
        copy.textContent = "📋 Copy";
      },1200);
    };

    actions.appendChild(copy);

    body.appendChild(actions);
  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(body);

  chatInner.appendChild(wrapper);

  scrollBottom();

  return textNode;
}

/* =========================
   TYPING
========================= */

function addTyping(){

  const wrapper = document.createElement("div");

  wrapper.className = "message assistant";
  wrapper.id = "typingMessage";

  wrapper.innerHTML = `
    <div class="avatar">✦</div>

    <div class="message-body">

      <div class="message-name">
        Aura AI
      </div>

      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>
  `;

  chatInner.appendChild(wrapper);

  scrollBottom();
}

function removeTyping(){

  document.getElementById("typingMessage")?.remove();
}

/* =========================
   GEMINI
========================= */

async function askGemini(promptText,imageData){

  busy = true;

  addTyping();

  const endpoint =
    `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${encodeURIComponent(apiKey)}`;

  const systemPrompt = `

तू Aura AI Advance हउ।

तोर व्यवहार:
- हमेशा मददगार रह।
- सरल भाषा में जवाब दे।
- उपयोगकर्ता भोजपुरी में पूछे त भोजपुरी में जवाब दे।
- हिंदी में पूछे त हिंदी में जवाब दे।
- English में पूछे त English में जवाब दे।
- गलत जानकारी confidently मत दे।
- जरूरत हो त जवाब को points में समझा।
- फोटो मिले त फोटो के ध्यान से देखकर जवाब दे।

निर्माता:
अगर उपयोगकर्ता पूछे कि Aura AI के के बनवले बा,
त कह:
"हमार निर्माण प्रद्युम्न कुमार कइले बानी।"

तोर उद्देश्य:
उपयोगकर्ता के पढ़ाई, जानकारी, writing, ideas,
coding और रोजमर्रा के सवाल में मदद करना।
`;

  const parts = [
    {
      text: promptText
    }
  ];

  if(imageData){

    parts.push({
      inline_data:{
        mime_type:imageData.mimeType,
        data:imageData.base64
      }
    });
  }

  try{

    const response = await fetch(endpoint,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        system_instruction:{
          parts:[
            {
              text:systemPrompt
            }
          ]
        },

        contents:[
          {
            role:"user",
            parts
          }
        ],

        generationConfig:{
          temperature:.7,
          maxOutputTokens:2048
        }

      })

    });

    const data = await response.json();

    if(!response.ok || data.error){
      throw new Error(
        data.error?.message ||
        `HTTP ${response.status}`
      );
    }

    const reply =
      data.candidates
      ?.map(c =>
        c.content?.parts
        ?.map(p=>p.text || "")
        .join("")
      )
      .filter(Boolean)
      .join("\n")
      ||
      "माफ करीं, अभी जवाब ना मिलल।";

    removeTyping();

    const textNode =
      addMessage(reply,"assistant");

    messages.push({
      role:"assistant",
      text:reply
    });

    saveCurrentChat();

    speak(reply);

  }catch(error){

    removeTyping();

    addMessage(
      "गड़बड़ भइल: " + error.message,
      "assistant"
    );

  }finally{

    busy = false;
    scrollBottom();
  }
}

/* =========================
   SPEECH OUTPUT
========================= */

function speak(text){

  if(!voiceEnabled) return;

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const clean =
    text
      .replace(/[*_#`~>]/g,"")
      .trim();

  const utterance =
    new SpeechSynthesisUtterance(clean);

  utterance.lang =
    language === "en"
      ? "en-US"
      : "hi-IN";

  utterance.rate = .95;
  utterance.pitch = 1.04;

  const voices =
    speechSynthesis.getVoices();

  const voice =
    voices.find(v =>
      language === "en"
        ? v.lang.startsWith("en")
        : v.lang.startsWith("hi")
    );

  if(voice){
    utterance.voice = voice;
  }

  speechSynthesis.speak(utterance);
}

/* =========================
   SPEECH INPUT
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.lang =
    language === "en"
      ? "en-US"
      : "hi-IN";

  recognition.onstart = () => {

    listening = true;

    micBtn.classList.add("active");
    micBtn.textContent = "⏹️";
  };

  recognition.onresult = event => {

    const transcript =
      event.results[0][0].transcript;

    chatInput.value = transcript;

    sendMessage();
  };

  recognition.onerror = () => {
    stopListening();
  };

  recognition.onend = () => {
    stopListening();
  };

}else{

  micBtn.disabled = true;
  micBtn.title =
    "आपके browser में voice support नइखे";
}

micBtn.onclick = () => {

  if(!recognition) return;

  if(listening){

    stopListening();

  }else{

    try{
      recognition.start();
    }catch(e){}
  }
};

function stopListening(){

  listening = false;

  micBtn.classList.remove("active");
  micBtn.textContent = "🎙️";

  try{
    recognition?.stop();
  }catch(e){}
}

/* =========================
   HISTORY
========================= */

function saveCurrentChat(){

  if(messages.length === 0) return;

  localStorage.setItem(
    "aura_current_chat",
    JSON.stringify(messages)
  );

  saveHistoryPreview();
}

function saveHistoryPreview(){

  const first =
    messages.find(m=>m.role==="user");

  if(!first) return;

  let history =
    JSON.parse(
      localStorage.getItem("aura_history") || "[]"
    );

  const item = {
    id:Date.now(),
    title:first.text.slice(0,45),
    messages:messages
  };

  history = history.filter(
    h => h.title !== item.title
  );

  history.unshift(item);

  history =
    history.slice(0,30);

  localStorage.setItem(
    "aura_history",
    JSON.stringify(history)
  );

  loadHistory();
}

function loadHistory(){

  historyBox.innerHTML = "";

  const history =
    JSON.parse(
      localStorage.getItem("aura_history") || "[]"
    );

  history.forEach(item=>{

    const div =
      document.createElement("div");

    div.className = "history-item";
    div.textContent =
      "💬 " + item.title;

    div.onclick = () => loadChat(item);

    historyBox.appendChild(div);
  });
}

function loadChat(item){

  messages =
    item.messages || [];

  chatInner.innerHTML = "";

  messages.forEach(m=>{

    addMessage(
      m.text,
      m.role === "user"
        ? "user"
        : "assistant"
    );

  });

  sidebar.classList.remove("open");

  scrollBottom();
}

/* =========================
   CURRENT CHAT RESTORE
========================= */

function restoreCurrentChat(){

  const saved =
    localStorage.getItem(
      "aura_current_chat"
    );

  if(!saved) return;

  try{

    const savedMessages =
      JSON.parse(saved);

    if(!Array.isArray(savedMessages) ||
       savedMessages.length === 0) return;

    messages = savedMessages;

    const welcome =
      document.getElementById("welcome");

    if(welcome) welcome.remove();

    messages.forEach(m=>{

      addMessage(
        m.text,
        m.role === "user"
          ? "user"
          : "assistant"
      );

    });

  }catch(e){}
}

restoreCurrentChat();

/* =========================
   SCROLL
========================= */

function scrollBottom(){

  setTimeout(()=>{

    chatBox.scrollTo({
      top:chatBox.scrollHeight,
      behavior:"smooth"
    });

  },50);
}

/* =========================
   VOICES
========================= */

if("speechSynthesis" in window){

  speechSynthesis.onvoiceschanged = () => {
    speechSynthesis.getVoices();
  };

}

</script>
