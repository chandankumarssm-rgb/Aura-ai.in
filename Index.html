<html lang="hi">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14151c">
<title>Aura AI — आपके device पर चलने वाला AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#14151c;
    --bg-raised:#1b1d27;
    --bg-raised-2:#22242f;
    --border:rgba(255,255,255,0.09);
    --text:#eeeae1;
    --text-muted:#93949f;
    --accent:#f2b84b;
    --accent-dim:rgba(242,184,75,0.16);
    --accent-line:rgba(242,184,75,0.35);
    --danger:#e7897a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', -apple-system, 'Noto Sans Devanagari', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    color:var(--text-muted);
  }

  /* ---------- chat ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:18px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .msg{
    max-width:88%;
    font-size:15px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--accent-dim);
    border:1px solid var(--accent-line);
    padding:10px 14px;
    border-radius:16px 16px 4px 16px;
  }
  .msg.assistant{
    align-self:flex-start;
    padding:2px 2px;
    color:var(--text);
  }
  .msg.assistant::before{
    content:"";
    display:inline-block;
    width:6px;
    height:6px;
      repetition_penalty: 1.15,
      streamer
    });
    const last = output[0].generated_text.at(-1);
    const reply = (last && last.content ? last.content : full).trim();
    bubble.textContent = reply || 'माफ़ कीजिए, जवाब नहीं बन पाया। दोबारा पूछिए।';
    messages.push({ role: 'assistant', content: reply });
  } catch (err) {
    console.error(err);
    bubble.textContent = 'कुछ गड़बड़ हो गई। दोबारा try करें।';
  } finally {
    bubble.classList.remove('pending');
    setBusy(false);
    input.focus();
  }
}

form.addEventListener('submit', (e) => {

  send(input.value);
});

window.addEventListener('error', (e) => {
  console.error('Unhandled error:', e.error || e.message);
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('Unhandled promise rejection:', e.reason);
});

init();
</script>
</body>
</html>
